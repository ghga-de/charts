deployment:
  enabled: true

cronSchedule: "0 * * * *"

cronjobs:
  cleanup:
    enabled: true
    name: cleanup
    schedule: "0 3 * * *"
    successfulJobsHistoryLimit: 2
    executable: cleanup-tool
    executableArgs:
      - "--dry-run"
  report:
    enabled: true
    name: report
  skipped:
    enabled: false
    name: skipped
